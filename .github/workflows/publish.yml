name: Publish to NuGet

on:
  push:
    branches: [ main ]
    paths:
      - 'Directory.Build.props'

  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Force NuGet publish (bypass version check)'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Nothing by default; every job below asks for what it needs.
permissions: {}

# The push to nuget.org is not made here. This workflow builds, tests and packs, uploads the packages as an artifact and asks the
# organization's central publisher (iyulab/nuget-publish) to push them; that repository holds the only trusted-publishing policy
# and checks this repository, this workflow file and the package ids against an allowlist. No NuGet credential lives here.
jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
      publish: ${{ steps.decide.outputs.publish }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0  # Full history for version detection

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Run tests (CI - No API keys)
      run: dotnet test --configuration Release --no-build --verbosity normal --filter-not-trait "Category=Performance" --filter-not-trait "Category=Integration" --filter-not-trait "Category=RequiresApiKey" --hangdump --hangdump-timeout 5m

    - name: Extract version from Directory.Build.props
      id: extract_version
      run: |
        VERSION=$(grep -oP '<Version>\K[^<]+' Directory.Build.props)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "📦 Extracted version: $VERSION"

    - name: Check if any package needs publishing
      id: check_version
      if: ${{ !inputs.force_publish }}
      run: |
        VERSION="${{ steps.extract_version.outputs.version }}"
        echo "🔍 Checking version $VERSION on NuGet.org..."

        # List of packages to check
        PACKAGES=(
          "Ironbees.Core"
          "Ironbees.AgentMode"
          "Ironbees.Autonomous"
          "Ironbees.Ironhive"
        )

        NEEDS_PUBLISH=false
        for PACKAGE in "${PACKAGES[@]}"; do
          # Ask the flat container for the exact nupkg: 200 means this version is already published.
          # (`dotnet nuget search` is not a command in the current SDK; its failure was swallowed by
          # `|| true` and read as "not found", so this check reported every version as unpublished.)
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://api.nuget.org/v3-flatcontainer/${PACKAGE,,}/${VERSION}/${PACKAGE,,}.${VERSION}.nupkg")
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "✅ $PACKAGE version $VERSION not found (HTTP $HTTP_STATUS) - needs publishing"
            NEEDS_PUBLISH=true
          else
            echo "⏭️ $PACKAGE version $VERSION already exists"
          fi
        done

        if [ "$NEEDS_PUBLISH" = true ]; then
          echo "should_publish=true" >> $GITHUB_OUTPUT
          echo "📤 At least one package needs publishing"
        else
          echo "should_publish=false" >> $GITHUB_OUTPUT
          echo "⚠️ All packages version $VERSION already exist on NuGet.org"
        fi

    # One answer for the jobs after this one: hand the packages over, or not.
    - name: Decide whether to publish
      id: decide
      run: |
        if [ "${{ steps.check_version.outputs.should_publish }}" == "true" ] || [ "${{ inputs.force_publish }}" == "true" ]; then
          echo "publish=true" >> $GITHUB_OUTPUT
        else
          echo "publish=false" >> $GITHUB_OUTPUT
        fi

    - name: Pack all NuGet packages
      if: ${{ steps.decide.outputs.publish == 'true' }}
      run: |
        echo "📦 Creating packages directory..."
        mkdir -p ./packages

        echo "🔨 Packing Ironbees.Core..."
        dotnet pack src/Ironbees.Core/Ironbees.Core.csproj \
          --configuration Release \
          --no-build \
          --output ./packages

        echo "🔨 Packing Ironbees.AgentMode..."
        dotnet pack src/Ironbees.AgentMode/Ironbees.AgentMode.csproj \
          --configuration Release \
          --no-build \
          --output ./packages

        echo "🔨 Packing Ironbees.Autonomous..."
        dotnet pack src/Ironbees.Autonomous/Ironbees.Autonomous.csproj \
          --configuration Release \
          --no-build \
          --output ./packages

        echo "🔨 Packing Ironbees.Ironhive..."
        dotnet pack src/Ironbees.Ironhive/Ironbees.Ironhive.csproj \
          --configuration Release \
          --no-build \
          --output ./packages

        echo "✅ All packages created"
        ls -lh ./packages/

    # Only .nupkg and .snupkg files: the central publisher refuses an artifact that holds anything else.
    - name: Upload packages
      if: ${{ steps.decide.outputs.publish == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: nuget-packages
        path: |
          ./packages/*.nupkg
          ./packages/*.snupkg
        if-no-files-found: error
        retention-days: 1

    - name: Summary
      if: always()
      run: |
        echo "## Publish Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **Version**: ${{ steps.extract_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Force Publish**: ${{ inputs.force_publish || 'false' }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY

        if [ "${{ steps.decide.outputs.publish }}" == "true" ]; then
          echo "- **Status**: 📦 Packed, handed to the central publisher" >> $GITHUB_STEP_SUMMARY
        else
          echo "- **Status**: ⏭️ Skipped (version already exists)" >> $GITHUB_STEP_SUMMARY
        fi

  # Asks the central publisher to push the packages and waits for its answer: this job succeeds only when they are on nuget.org.
  # Until the repository is on the publisher's allowlist the call is refused and the jobs after it do not run.
  publish:
    needs: pack
    if: ${{ needs.pack.outputs.publish == 'true' }}
    uses: iyulab/nuget-publish/.github/workflows/request.yml@2166748abf716fb58855228f65fc6b8f78c2780f # main
    permissions: {}
    secrets: inherit

  # The tag and the GitHub release exist only for a version that reached nuget.org.
  release:
    needs: [pack, publish]
    if: ${{ needs.pack.outputs.publish == 'true' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Download packages
      uses: actions/download-artifact@v8
      with:
        name: nuget-packages
        path: ./packages

    # Release notes = this version's CHANGELOG.md section. Every iyulab publish workflow carries this awk program
    # verbatim; change it in all of them or in none.
    - name: Release notes (this version's CHANGELOG section)
      shell: bash
      run: |
        VERSION=$(grep -oP '<(Version|VersionPrefix)>\K[^<]+' Directory.Build.props | head -1)
        awk -v v="$VERSION" '/^## /{if(p)exit;h=$0;sub(/^## +\[?v?/,"",h);c=substr(h,length(v)+1,1);if(index(h,v)==1&&(c==""||c=="]"||c==" "||c=="\t")){p=1;next}}p&&(n||$0!~/^[ \t]*$/){l[++n]=$0}END{while(n&&(l[n]~/^[ \t]*$/||l[n]~/^---+$/))n--;for(i=1;i<=n;i++)print l[i]}' CHANGELOG.md > release-notes.md
        if [ ! -s release-notes.md ]; then echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; fi

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ needs.pack.outputs.version }}
        body_path: release-notes.md
        name: Release v${{ needs.pack.outputs.version }}
        draft: false
        prerelease: ${{ contains(needs.pack.outputs.version, 'preview') || contains(needs.pack.outputs.version, 'beta') || contains(needs.pack.outputs.version, 'alpha') }}
        files: ./packages/*.nupkg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
